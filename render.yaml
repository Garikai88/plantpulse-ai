services:
  # Single Web Service running our Node.js / Express API Engine
  - type: web
    name: plantpulse-api
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node index.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: plantpulse-db
          property: connectionString
      - key: PORT
        value: 10000

databases:
  # Managed PostgreSQL Database
  - name: plantpulse-db
    plan: free
    databaseName: plantpulse_db
    user: plantpulse_user